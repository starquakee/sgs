<!doctype html><html class="sgs-game"><head><meta charset="utf-8"><title>手牌布局回归样例</title><link rel="stylesheet" href="../layout/default/layout.css"><link rel="stylesheet" href="../theme/style/card/ol.css"><link rel="stylesheet" href="table.css"><style>#test{position:fixed;left:25px;top:75px;z-index:999;font:16px/1.5 monospace;color:#fff}#result{white-space:pre-wrap;max-height:350px;overflow:auto;width:740px}html.sgs-game #window #arena #me{left:26px!important;right:auto!important;width:600px!important;bottom:22px!important}#run{padding:10px;font-size:18px}</style></head><body><section id="test"><p>布局回归样例（不运行游戏规则）· 使用锁定引擎的原始 updatehl</p><button id="run" disabled>9 → 8 张：移出一张牌</button><button id="faces" style="padding:10px;font-size:18px">查看5张完整牌面</button><pre id="result"></pre></section><div id="window"><div id="arena" class="oblongcard"><div id="me"><div id="handcards1"><div class="handcards"></div></div><div id="handcards2"><div class="handcards"></div></div></div></div></div><script>
const game = {me:{}}; const lib={config:{fold_card:true,spread_card:false}};
const ui={handcards1Container:document.querySelector('#handcards1'),handcards2Container:document.querySelector('#handcards2'),refresh:node=>void getComputedStyle(node).opacity,__NATIVE_SPREAD__,__NATIVE_UPDATE__};
const hand=ui.handcards1Container.firstElementChild;
const names=[['sha','杀','♣︎','J'],['wuxie','无懈可击','♦︎','Q'],['huogong','火攻','♦︎','Q'],['sha','杀','♠︎','9'],['tiesuo','铁索连环','♣︎','K'],['shan','闪','♥︎','2'],['sha','火杀','♦︎','5','fire'],['sha','雷杀','♠︎','7','thunder'],['sha','杀','♠︎','8']];
for(const [name,title,suit,rank,nature] of names){const card=document.createElement('div');card.className='card fullskin'+(nature?' '+nature:'');card.dataset.cardName=name;card.dataset.cardType=['sha','shan','tao'].includes(name)?'basic':name==='bagua'?'equip':'trick';card.innerHTML='<div class="image" style="background-image:url(../image/card/'+name+'.png)"></div><div class="info'+(['♥︎','♦︎'].includes(suit)?' red':'')+'">'+suit+'<span> </span><span>'+rank+'</span></div><div class="name">'+title+'</div>';card.node={name:card.querySelector('.name'),info:card.querySelector('.info')};hand.append(card);}
function snapshot(){return Array.from(hand.children).map(card=>{const r=card.getBoundingClientRect();return {card,faceText:card.textContent,key:card.dataset.cardName+card.node.info.textContent,nameY:card.node.name.getBoundingClientRect().y-r.y,infoY:card.node.info.getBoundingClientRect().y-r.y,infoX:card.node.info.getBoundingClientRect().x-r.x,transitions:getComputedStyle(card).transitionProperty};});}
ui.updatehl();let before;
setTimeout(()=>{before=snapshot();document.querySelector('#run').disabled=false;document.querySelector('#result').textContent='Ready: 9 real card nodes, native updatehl, 600px rail.'},650);
document.querySelector('#run').onclick=()=>{const old=Array.from(hand.children);old[3].remove();ui.updatehl();setTimeout(()=>{const after=snapshot();const checks=after.map(current=>{const original=before.find(item=>item.card===current.card);return {key:current.key,sameNode:Boolean(original),sameText:original.faceText===current.faceText,nameShift:Math.round((current.nameY-original.nameY)*100)/100,infoShift:[current.infoX-original.infoX,current.infoY-original.infoY],cardMovesAsUnit:current.transitions.includes('transform')};});const passed=checks.every(item=>item.sameNode&&item.sameText&&Math.abs(item.nameShift)<0.5&&item.infoShift.every(n=>Math.abs(n)<0.5)&&item.cardMovesAsUnit);document.querySelector('#result').textContent=JSON.stringify({passed,checks},null,2);},650);};
document.querySelector('#faces').onclick=()=>{for(const card of Array.from(hand.children)){if(!['sha♣︎ J','wuxie♦︎ Q','huogong♦︎ Q','sha♦︎ 5','sha♠︎ 7'].includes(card.dataset.cardName+card.node.info.textContent))card.remove();}ui.updatehl();document.querySelector('#result').textContent='完整牌面样例：普通杀、无懈可击、火攻、官方火杀、官方雷杀。';};</script></body></html>
